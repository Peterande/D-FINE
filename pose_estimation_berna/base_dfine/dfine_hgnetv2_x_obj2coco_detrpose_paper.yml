__include__: [
  '../../configs/dataset/coco_detection.yml',
  '../../configs/runtime.yml',
  '../../configs/dfine/include/dataloader.yml',
  '../../configs/dfine/include/optimizer.yml',
  '../../configs/dfine/include/dfine_hgnetv2.yml',
]

output_dir: ./output/dfine_hgnetv2_x_obj2coco_detrpose_paper

# IMPORTANT:
# coco_detection.yml sets num_classes=80 globally. DETRPoseTransformer shares `num_classes`,
# so without overriding it here, the decoder will silently become 80-class.
num_classes: 2

DFINE:
  backbone: HGNetv2
  encoder: HybridEncoder
  decoder: DETRPoseTransformer

HGNetv2:
  name: 'B5'
  return_idx: [1, 2, 3]
  freeze_stem_only: True
  freeze_at: 0
  freeze_norm: True

# X-size encoder: hidden_dim=384 to match D-FINE-X detection config
HybridEncoder:
  hidden_dim: 384
  dim_feedforward: 2048

# Paper-like DETRPose defaults — hidden_dim=384 to match encoder output
DETRPoseTransformer:
  num_classes: 2
  num_queries: 60
  hidden_dim: 384
  num_decoder_layers: 6
  dim_feedforward: 2048
  dropout: 0.0
  activation: relu
  num_feature_levels: 3
  dec_n_points: 4
  nhead: 8
  aux_loss: True
  num_body_points: 17
  feat_strides: [8, 16, 32]
  eval_spatial_size: [640, 640]
  reg_max: 32
  reg_scale: 8.0
  dn_number: 20
  dn_label_noise_ratio: 0.5

DFINEPostProcessor:
  num_top_queries: 60